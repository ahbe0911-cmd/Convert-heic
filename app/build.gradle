plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.convertheic.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.convertheic.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.github.msisuzney.GlideHeifDecoder:heifdecoder:0.5'
}
