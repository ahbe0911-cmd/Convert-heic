plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.convertheic.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.convertheic.app'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDir "$buildDir/generated/res/zippix"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register("decodeZipPixAssets") {
    def iconInput = rootProject.file("branding/zippix_icon_256.b64")
    def iconOutput = file("$buildDir/generated/res/zippix/drawable/zippix_icon.webp")
    def fontInput = rootProject.file("branding/vazirmatn.ttf.b64")
    def fontOutput = file("$buildDir/generated/res/zippix/font/vazirmatn.ttf")

    inputs.files(iconInput, fontInput)
    outputs.files(iconOutput, fontOutput)

    doLast {
        iconOutput.parentFile.mkdirs()
        iconOutput.bytes = java.util.Base64.decoder.decode(iconInput.text.replaceAll("\\s",""))
        fontOutput.parentFile.mkdirs()
        fontOutput.bytes = java.util.Base64.decoder.decode(fontInput.text.replaceAll("\\s",""))
    }
}

tasks.named("preBuild").configure {
    dependsOn("decodeZipPixAssets")
}

dependencies {
    implementation 'com.github.msisuzney.GlideHeifDecoder:heifdecoder:0.5'
    implementation 'androidx.core:core:1.15.0'
}
