plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.convertheic.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.convertheic.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDir "$buildDir/generated/res/zippix"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register("decodeZipPixIcon") {
    def inputFile = rootProject.file("branding/zippix_icon_256.b64")
    def outputFile = file("$buildDir/generated/res/zippix/drawable/zippix_icon.webp")

    inputs.file(inputFile)
    outputs.file(outputFile)

    doLast {
        outputFile.parentFile.mkdirs()
        byte[] decoded = java.util.Base64.decoder.decode(inputFile.text.trim())
        outputFile.bytes = decoded
    }
}

tasks.named("preBuild").configure {
    dependsOn("decodeZipPixIcon")
}

dependencies {
    implementation 'com.github.msisuzney.GlideHeifDecoder:heifdecoder:0.5'
}
